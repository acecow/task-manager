<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
</head>
<body>
    <main>
        <hgroup>
            <h1>Task manager</h1>
            <p>by acecow</p>
        </hgroup>

        <nav class="switch">
            <a>task list</a><a>new task</a>
        </nav>

        <section class="taskPage">
            <h2>Tasks</h2>
            <nav class="filters">
                <a>all</a><a>in process</a><a>finished</a>
            </nav>

            <ul class="tasks">
            </ul>
        </section>
        
        <section class="createTask">
            <form>
                <h2>New task</h2>
                <input id="taskTitle" placeholder="Task's title" type="text" required>
                <textarea id="descriptionOfTask" placeholder="Description"></textarea>
                <button type="submit" id="createNewTask">Create task</button>
            </form>
        </section>
    </main>
</body>
</html>
